<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue & Yellow Service</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
</head>
<body>
    <!-- Nav section -->
    <header class="nav-section">
        <nav class="nav-container">
            <!-- Logo -->
            <header>
                <logo-blue-yellow></logo-blue-yellow>
            </header>
            <!-- Links -->
            <ul class="links-list">
                <a href="">
                    <link-btn value="Intereses"></link-btn>
                </a>
                <a href="">
                    <link-btn value="Link"></link-btn>
                </a>
                <a href="">
                    <link-btn value="Link"></link-btn>
                </a>
                <a href="">
                    <link-btn value="Sobre Nosotros"></link-btn>
                </a> 
            </ul>
            <footer>
                <a href="#form-section">
                <action-btn  value="Contáctanos"></action-btn></a>
            </footer>
        </nav>
    </header>
    <main>
        <!-- Presentation -->
        <section class="presentation">
                <svg viewBox="0 0 900 460" preserveAspectRatio="xMidYMid slice">
                    <path d="M-40,420 Q380,40 920,180" fill="none" stroke="var(--primary-color)" stroke-width="1.6" opacity="0.16"/>
                    <g stroke="var(--primary-color)" stroke-width="1.6" opacity="0.16" stroke-linecap="round">
                    <line x1="895" y1="170" x2="920" y2="180"/>
                    <line x1="900" y1="196" x2="920" y2="180"/>
                    </g>
                    <path d="M940,410 Q560,90 -20,240" fill="none" stroke="var(--secondary-color)" stroke-width="1.6" opacity="0.22"/>
                    <g stroke="var(--secondary-color)" stroke-width="1.6" opacity="0.22" stroke-linecap="round">
                    <line x1="3" y1="228" x2="-20" y2="240"/>
                    <line x1="6" y1="254" x2="-20" y2="240"/>
                    </g>
                </svg>
            <h1>Blue and Yellow</h1>
            <p>Compañia de exportación e importación de productos multicategoría</p>
        </section>

        <!-- Verificable data -->
        <section class="verifications">
            <header>
                <h1>Puedes confiar en nosotros</h1>
                <p >Somos una compañía registrada</p>
            </header>
            
            <div class="verification-cards">
                <!-- Verificable data with WebComponents -->
                <verification-card></verification-card>
                <verification-card></verification-card>
                <verification-card></verification-card>
                <verification-card></verification-card>
            </div>
            
            <footer>
                <a href="document.pdf" download>
                    <action-btn value="Descargar datos"></action-btn>
                </a>
            </footer>
        </section>

        <!-- Countries -->
        <section class="countries">
            <div class="world">
                <img src="assets/svg/worldLow.svg" alt="Mapa del mundo">
            </div>
            <article>
                <h1>Países de interés</h1>
                <div class="flags-list">
                    <flag-logo src="assets/svg/flags/ar.svg" alt="Argentina"></flag-logo>
                    <flag-logo src="assets/svg/flags/us.svg" alt="Estados Unidos"></flag-logo>
                    <flag-logo src="assets/svg/flags/ve.svg" alt="Venezuela"></flag-logo>
                    <flag-logo src="assets/svg/flags/ca.svg" alt="Canada"></flag-logo>
                </div>
            </article>
        </section>

        <!-- Products and Categories -->
        <section class="products">
            <h1>Categorías de interés</h1>
            
        </section>

        <!-- Contact Form -->
        <section id="form-section" class="form-container">
            <main class="contact-form">
                <hgroup>
                    <h1>Formulario de contacto</h1>
                    <p>Comencemos negociaciones serias</p>
                </hgroup>
                <form action="">
                    <input-label text-label="Correo electrónico" type="email" placeholder="distribuidor@gmail.com"></input-label>
                    <div class="textarea-group">
                        <label for="textarea">Mensaje
                        <textarea name="textarea" id="1"></textarea></label>
                    </div>
                    <input class="submit-btn" type="submit" value="Enviar">
                </form>
            </main>
        </section>
    </main>
    <footer-section></footer-section>
</body>
</html>
